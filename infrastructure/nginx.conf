# ============================================================
# nginx.conf — ClaimSaathi reverse proxy
# HTTPS termination, security headers, upstream routing
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured access log
    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"correlation_id":"$http_x_correlation_id"}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Limit client body size (upload cap enforced at proxy layer)
    client_max_body_size 26m;   # 25 MB app limit + 1 MB header overhead

    # Upstream: FastAPI backend
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    # Upstream: Next.js frontend
    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    # --------------------------------------------------------
    # HTTP -> HTTPS redirect (local dev uses self-signed cert)
    # --------------------------------------------------------
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # --------------------------------------------------------
    # HTTPS server
    # --------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # --- Security headers ---
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff"                             always;
        add_header X-Frame-Options           "DENY"                                always;
        add_header X-XSS-Protection          "1; mode=block"                       always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none';"
            always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # --- API: route to backend ---
        location /api/ {
            proxy_pass         http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 120s;     # allow for slow AI endpoints
            proxy_send_timeout 120s;
        }

        # --- Health/readiness/version: route to backend ---
        location ~ ^/(health|readiness|version)$ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   Connection      "";
        }

        # --- SSE: claim event streams (disable buffering) ---
        location ~ ^/api/v1/claims/[^/]+/events$ {
            proxy_pass             http://backend;
            proxy_http_version     1.1;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       Connection        "";
            proxy_buffering        off;
            proxy_cache            off;
            proxy_read_timeout     600s;
            chunked_transfer_encoding on;
        }

        # --- Internal routes: block external access entirely ---
        location /internal/ {
            # Only reachable from within the Docker network (n8n -> backend directly)
            # At the nginx layer, we deny any request coming through the external interface
            deny all;
            return 403 '{"type":"https://claimsaathi.in/errors/forbidden","title":"Forbidden","status":403}';
        }

        # --- n8n: pass through for UI access (dev only) ---
        location /n8n/ {
            proxy_pass         http://n8n:5678/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 120s;
        }

        # --- Frontend: all other routes -> Next.js ---
        location / {
            proxy_pass         http://frontend/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }
    }
}
