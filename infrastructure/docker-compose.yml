version: "3.9"

# ============================================================
# ClaimSaathi — Docker Compose (local development)
# Brings up: nginx, backend, frontend, postgres, redis, n8n, minio
# ============================================================

networks:
  claimsaathi_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  n8n_data:

services:

  # ----------------------------------------------------------
  # NGINX — reverse proxy, TLS termination, secure headers
  # ----------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: cs_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro          # self-signed certs for local demo
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - claimsaathi_net
    restart: unless-stopped

  # ----------------------------------------------------------
  # BACKEND — FastAPI modular monolith
  # ----------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.backend
    container_name: cs_backend
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-claimsaathi}:${POSTGRES_PASSWORD:-claimsaathi_dev}@postgres:5432/${POSTGRES_DB:-claimsaathi}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-claimsaathi}:${POSTGRES_PASSWORD:-claimsaathi_dev}@postgres:5432/${POSTGRES_DB:-claimsaathi}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - N8N_WEBHOOK_BASE_URL=http://n8n:5678/webhook
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - claimsaathi_net
    restart: unless-stopped
    volumes:
      - ../scripts:/app/scripts:ro

  # ----------------------------------------------------------
  # RQ WORKER — background jobs (OCR, embedding)
  # ----------------------------------------------------------
  worker:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.backend
    container_name: cs_worker
    command: ["rq", "worker", "--with-scheduler", "--url", "redis://redis:6379/0", "claimsaathi_ocr", "claimsaathi_embed", "claimsaathi_default"]
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-claimsaathi}:${POSTGRES_PASSWORD:-claimsaathi_dev}@postgres:5432/${POSTGRES_DB:-claimsaathi}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-claimsaathi}:${POSTGRES_PASSWORD:-claimsaathi_dev}@postgres:5432/${POSTGRES_DB:-claimsaathi}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - claimsaathi_net
    restart: unless-stopped

  # ----------------------------------------------------------
  # FRONTEND — Next.js
  # ----------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: ../infrastructure/Dockerfile.frontend
    container_name: cs_frontend
    env_file:
      - ../.env
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost/api
    expose:
      - "3000"
    networks:
      - claimsaathi_net
    restart: unless-stopped

  # ----------------------------------------------------------
  # POSTGRESQL 16 + pgvector
  # ----------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cs_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-claimsaathi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claimsaathi_dev}
      POSTGRES_DB: ${POSTGRES_DB:-claimsaathi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro   # init scripts (role grants)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-claimsaathi} -d ${POSTGRES_DB:-claimsaathi}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - claimsaathi_net
    restart: unless-stopped
    expose:
      - "5432"

  # ----------------------------------------------------------
  # REDIS — cache + RQ job queue
  # ----------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: cs_redis
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - claimsaathi_net
    restart: unless-stopped
    expose:
      - "6379"

  # ----------------------------------------------------------
  # MINIO — S3-compatible object storage
  # ----------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: cs_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-claimsaathi_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-claimsaathi_minio_secret}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"   # MinIO console — direct access for dev
    expose:
      - "9000"
    networks:
      - claimsaathi_net
    restart: unless-stopped

  # MinIO bucket initializer (runs once, creates required buckets)
  minio-init:
    image: minio/mc:latest
    container_name: cs_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-claimsaathi_minio} ${MINIO_SECRET_KEY:-claimsaathi_minio_secret};
        mc mb --ignore-existing local/${MINIO_BUCKET_DOCUMENTS:-claimsaathi-documents};
        mc mb --ignore-existing local/${MINIO_BUCKET_EXPORTS:-claimsaathi-exports};
        mc anonymous set none local/${MINIO_BUCKET_DOCUMENTS:-claimsaathi-documents};
        mc anonymous set none local/${MINIO_BUCKET_EXPORTS:-claimsaathi-exports};
        echo 'MinIO buckets ready (private — no public access)';
      "
    networks:
      - claimsaathi_net

  # ----------------------------------------------------------
  # N8N — workflow orchestration
  # ----------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: cs_n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-true}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-changeme}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-changeme_32chars_minimum_required}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://n8n:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
      - N8N_LOG_LEVEL=info
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n/workflows:/home/node/.n8n/workflows:ro   # version-controlled workflow JSONs
    ports:
      - "5678:5678"
    networks:
      - claimsaathi_net
    restart: unless-stopped
